# =============================================================================
# Dinghy Display — pinned version catalog (PKG-02, D-04/D-09)
#
# This is the SINGLE SOURCE OF VERSIONS for the whole build. The project's
# central risk is "a modern AndroidX/Compose lib silently raises the minSdk
# floor above 23 (Nexus 7 2013)." Every version is pinned here so the floor is
# auditable; the enforcement that actually proves the floor is the verifyMinSdk
# task (see build-logic/verify-min-sdk.gradle.kts), because pins alone cannot
# stop a *transitive* dep from raising the MERGED-manifest minSdk.
#
# Build quartet is VERIFIED (01-RESEARCH.md): Kotlin 2.1.21 / AGP 8.7.0 /
# Gradle 8.9 / compileSdk 36 / build-tools 34 / Compose BOM 2026.05.00 (STABLE
# channel → Compose UI 1.11.1).  Do NOT bump composeBom to an alpha channel —
# the 2026.05.00 *alpha* points at the next Compose minor / compileSdk 37 /
# AGP 9 line, the exact churn this project avoids.  No dynamic ("+") versions.
#
# compileSdk NOTE (Phase 21): bumped 35→36 because media3 1.10.1's AAR metadata
# HARD-REQUIRES compileSdkVersion >= 36 (checkDebugAarMetadata fails at 35 — the
# earlier "compileSdk 35 in range" claim was factually wrong). AGP 8.7.0 accepts
# compileSdk 36 (emits a non-fatal "max recommended 35" warning). This is an
# accepted middle step — it is DISTINCT from and does NOT cross the still-forbidden
# AGP-9 / compileSdk-37 / Compose-1.12 line. targetSdk stays 35; the minSdk-23
# Nexus 7 floor is UNCHANGED and PROVEN green by verifyMinSdkRelease after media3.
# =============================================================================

[versions]
# --- Build quartet (VERIFIED) ---
kotlin = "2.1.21"            # Kotlin 2.1.x ↔ Gradle 8.7–8.10; 2.1.21 fixes a >8.7 test-fixtures bug
agp = "8.7.0"               # requires Gradle 8.9 + JDK 17+, build-tools 34; accepts compileSdk 36 (warn-only)
composeBom = "2026.05.00"   # STABLE channel → Compose UI 1.11.1 (NOT the alpha channel)

# --- SDK levels (also set in app/build.gradle.kts; mirrored here for audit) ---
minSdk = "23"               # Nexus 7 2013 floor — asserted on the MERGED manifest by verifyMinSdk
targetSdk = "35"
compileSdk = "36"            # :app bumped 35→36 for media3 1.10.1 AAR metadata (see header NOTE); :macrobenchmark stays 35

# --- AndroidX (minSdk-23 baseline since June 2025) ---
activity = "1.9.3"
lifecycle = "2.8.7"
appcompat = "1.7.0"
recyclerview = "1.3.2"
constraintlayout = "2.1.4"
coreKtx = "1.13.1"

# --- Networking / serialization (locked stack) ---
okhttp = "4.12.0"           # minSdk 21 — one client for ws:// + http://
retrofit = "2.11.0"
kotlinxSerialization = "1.7.3"
coroutines = "1.9.0"

# --- Imaging (Coil 3, minSdk 23 exactly, fixed large-PNG OOM on API ≤23) ---
coil = "3.1.0"

# --- Camera + QR decode (SPOOL-05/06, Phase 11 — RESEARCH Pitfall 1/2) ---
# CameraX 1.5.0 raised its floor to EXACTLY 23 (== our Nexus 7 floor); PROVEN by
# verifyMinSdk after wiring. NOT 1.4.x (older floor story); do NOT bump blind.
cameraX = "1.5.0"
# zxing:core 3.3.3 — DO NOT bump to 3.4.0+. From 3.4.0 the QR decode path
# (FinderPatternFinder) calls Java-8 List.sort, which NoSuchMethodError-crashes on
# API 23. flox is API 30 so a device run would NOT catch it — the JVM
# ZxingDecodeVersionTest + this pin are the only guards (RESEARCH Pitfall 1,
# github.com/zxing/zxing/issues/1170). No coreLibraryDesugaring — the 3.3.3 pin avoids it.
zxingCore = "3.3.3"

# --- Persistence (THEME-02/D-02) ---
# DataStore Preferences — coroutine/Flow-native settings store for the S/M/L --fs choice,
# theme base, and custom token deltas. AndroidX 1.1.x line is minSdk-23-safe (June-2025 floor);
# the MERGED-manifest floor is PROVEN by verifyMinSdk after adding it (RESEARCH Pitfall 6).
datastore = "1.1.7"

# --- Media3 / ExoPlayer H.264 transport (Phase 21, CAM-11/13/14/16 — D-01/D-09) ---
# Pin 1.10.1 = latest stable (2026-05-12); any >= 1.10.0 carries the load-bearing fix. The RTSP
# H.264 access-unit-spanning-multiple-RTP-packets corruption (the printers' 720p / 1s-GOP keyframes,
# RESEARCH Pitfall 4 / androidx/media #3121) was a 1.9.x REGRESSION, FIXED in 1.10.0 — NOT broken in
# 1.10.0. CONFIRM the fix is present in the resolved artifact rather than trusting the version string.
# minSdk 23 since 1.9.0 (Dec 2025) == our Nexus 7 floor; the MERGED-manifest floor is PROVEN by
# verifyMinSdkRelease after wiring (a transitive dep could move it — the project's central trap).
# Artifacts resolve from Google Maven (google() in settings.gradle.kts), NOT Maven Central.
media3 = "1.10.1"

# --- Measurement tooling (:macrobenchmark) ---
benchmarkMacro = "1.3.3"
uiautomator = "2.3.0"
profileinstaller = "1.4.1"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
# --- Compose (versions governed by the BOM) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Compose UI test (BOM-governed) — instrumented ShellPresenceTest (04-07) drives the drawer/routing.
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- AndroidX core / lifecycle / activity ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- AndroidX Views (hybrid-Views head-to-head scene) ---
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# --- Networking / serialization ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Test-only sibling of the runtime coroutines lib (tracks the same 1.9.0 pin) —
# gives JVM unit tests virtual time (runTest/TestScope) for Wave 2/3. NOT a runtime dep.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Coil 3 ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Camera + QR decode (Phase 11) ---
# Four first-party AndroidX CameraX artifacts (all version.ref = cameraX) + canonical ZXing core.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

# --- Persistence (THEME-02/D-02) ---
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Media3 / ExoPlayer H.264 transport (Phase 21) ---
# Three first-party AndroidX media3 artifacts (all version.ref = media3). Deliberately NOT including
# media3-ui / media3-ui-compose / media3-datasource extras — the project hosts its own SurfaceView
# (footprint discipline, RESEARCH "Deliberately NOT included"). -hls is in NOW because the spike
# (plan 02) measures both transports. media3-common is pulled transitively by media3-exoplayer.
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-rtsp = { group = "androidx.media3", name = "media3-exoplayer-rtsp", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }

# --- Measurement (:macrobenchmark) ---
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose compiler ships WITH Kotlin 2.x — version == Kotlin, no separate pin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
