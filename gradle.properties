# Dinghy Display — Gradle build properties
#
# JVM args sized for the AGP 8.7 / R8 release build on a dev box; metaspace
# bumped so R8 + Compose compilation don't thrash. UTF-8 for deterministic
# resource processing.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX is mandatory for the locked stack (Compose, Activity, Lifecycle).
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official

# Non-transitive R classes — smaller R, faster builds; fine for greenfield.
android.nonTransitiveRClass=true

# Configuration-on-demand off for predictable multi-module behavior.
org.gradle.configureondemand=false

# R5a: run lint in its own worker JVM (resolved via the kotlin jvmToolchain(17) in
# app/build.gradle.kts) instead of inside the JDK-21 Gradle daemon — the AGP-8.7
# lint UAST crash is JDK-21-specific.
android.experimental.runLintInProcess=false
