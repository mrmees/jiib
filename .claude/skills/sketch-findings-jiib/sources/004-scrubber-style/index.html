<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>004 — Scrubber style (thin track + ring thumb)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../themes/default.css" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--ui); -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:30px; transition:background .2s; }

  .wrap { width:min(720px, 92vw); display:flex; flex-direction:column; gap:26px; }
  .head { text-align:center; color:var(--text-3); font-size:13px; text-transform:uppercase; letter-spacing:.1em; }

  .card { background:var(--surface); border:1.5px solid var(--hair); border-radius:var(--r-card); padding:26px 30px;
    display:flex; flex-direction:column; gap:22px; }
  .row1 { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
  .nm { font-size:calc(20px*var(--fs)); font-weight:700; letter-spacing:-.01em; }
  .val { font-family:var(--mono); font-weight:700; font-size:calc(40px*var(--fs)); letter-spacing:-.03em; }
  .val .u { color:var(--text-3); font-size:.55em; margin-left:4px; }

  /* ===== Scrubber (port of the reference: thin track + ringed thumb) ===== */
  .scrub { padding:18px 0 4px; }
  .scrub-track {
    position:relative; height:6px; border-radius:999px;
    background:var(--surface-3);                 /* the muted REMAINDER (ref #94A3B3) */
    cursor:pointer; touch-action:none;
  }
  .scrub-fill {
    position:absolute; left:0; top:0; bottom:0; border-radius:999px;
    background:var(--accent);                     /* the filled PROGRESS (ref #18244D) */
  }
  .scrub-thumb {
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:34px; height:34px; border-radius:999px;
    background:var(--surface);                     /* raised knob center */
    border:5px solid var(--accent);               /* thick accent ring */
    box-shadow:0 2px 9px rgba(0,0,0,.45);
    transition:box-shadow .15s;
  }
  .scrub-thumb::after {                            /* enlarged invisible touch target (floor-friendly) */
    content:''; position:absolute; inset:-20px;
  }
  .scrub-track:active .scrub-thumb { box-shadow:0 0 0 10px var(--accent-soft), 0 2px 9px rgba(0,0,0,.45); }
  .ends { display:flex; justify-content:space-between; font-family:var(--mono); font-size:calc(13px*var(--fs)); color:var(--text-3); margin-top:12px; }

  #tools { position:fixed; bottom:12px; right:12px; font-family:system-ui; font-size:12px; background:rgba(0,0,0,.72); color:#fff;
    padding:8px 10px; border-radius:10px; opacity:.45; transition:opacity .2s; display:flex; gap:12px; align-items:center; }
  #tools:hover { opacity:1; }
  #tools .g { display:flex; gap:5px; align-items:center; }
  #tools .g span { color:#8b93a0; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  #tools button { background:#20242b; color:#dfe4ea; border:1px solid rgba(255,255,255,.12); border-radius:7px; padding:4px 9px; cursor:pointer; font-size:12px; }
  #tools button.on { background:#3457b0; border-color:#4f7dff; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">Scrubber style — for future drag-adjust screens (ported to jiib tokens)</div>
  <div class="card" id="c-flow"></div>
  <div class="card" id="c-z"></div>
</div>

<div id="tools">
  <div class="g"><span>Theme</span><button id="thDark" class="on">Dark</button><button id="thLight">Light</button></div>
  <div class="g"><span>Text</span><button data-fs="1.0">S</button><button data-fs="1.15" class="on">M</button><button data-fs="1.32">L</button></div>
</div>

<script>
const S = {
  flow: { el:'c-flow', name:'Flow', val:118, min:50, max:150, step:1, dec:0, unit:'%' },
  z:    { el:'c-z',    name:'Z Offset', val:-0.04, min:-1, max:1, step:0.005, dec:3, unit:'mm' },
};
const fmt = (s,v)=> s.dec ? v.toFixed(s.dec) : Math.round(v).toString();
const clamp=(s,v)=> Math.min(s.max, Math.max(s.min, v));
const refs = {};

// Build the DOM ONCE; never rebuild the dragged element. Updates mutate fill/thumb/value in place
// (rebuilding mid-drag detaches the node and kills pointermove — the Phase-19 inline-scrubber bug).
function build(s){
  document.getElementById(s.el).innerHTML = `
    <div class="row1"><div class="nm">${s.name}</div><div class="val" id="${s.el}-v"></div></div>
    <div class="scrub">
      <div class="scrub-track" id="${s.el}-t">
        <div class="scrub-fill" id="${s.el}-f"></div>
        <div class="scrub-thumb" id="${s.el}-h"></div>
      </div>
      <div class="ends"><span>${fmt(s,s.min)}${s.unit}</span><span>${fmt(s,s.max)}${s.unit}</span></div>
    </div>`;
  const track = document.getElementById(`${s.el}-t`);
  refs[s.k] = { track, fill:document.getElementById(`${s.el}-f`), thumb:document.getElementById(`${s.el}-h`), val:document.getElementById(`${s.el}-v`) };
  update(s);
  const setX = (x)=>{ const r=track.getBoundingClientRect(); let f=(x-r.left)/r.width; f=Math.min(1,Math.max(0,f));
    let v=s.min+f*(s.max-s.min); v=Math.round(v/s.step)*s.step; s.val=clamp(s,+v.toFixed(6)); update(s); };
  track.addEventListener('pointerdown',(e)=>{ track.setPointerCapture(e.pointerId); setX(e.clientX);
    const mv=(ev)=>setX(ev.clientX);
    const up=()=>{ track.removeEventListener('pointermove',mv); track.removeEventListener('pointerup',up); };
    track.addEventListener('pointermove',mv); track.addEventListener('pointerup',up);
  });
}
function update(s){
  const f=(s.val-s.min)/(s.max-s.min), r=refs[s.k];
  r.fill.style.width = f*100+'%'; r.thumb.style.left = f*100+'%';
  r.val.innerHTML = `${fmt(s,s.val)}<span class="u">${s.unit}</span>`;
}
for (const k in S){ S[k].k=k; build(S[k]); }

document.getElementById('thDark').onclick=()=>{document.documentElement.removeAttribute('data-theme'); document.getElementById('thDark').classList.add('on'); document.getElementById('thLight').classList.remove('on');};
document.getElementById('thLight').onclick=()=>{document.documentElement.setAttribute('data-theme','light'); document.getElementById('thLight').classList.add('on'); document.getElementById('thDark').classList.remove('on');};
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--fs',b.dataset.fs); document.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',x===b));});
</script>
</body>
</html>
