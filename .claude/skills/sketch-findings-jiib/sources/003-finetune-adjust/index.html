<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>003 — Fine-Tune (numeric adjustment)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet" />
<link rel="stylesheet" href="../themes/default.css" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#000; color:var(--text); font-family:var(--ui); -webkit-font-smoothing:antialiased; overflow:hidden; }

  #topbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px; background:rgba(10,12,16,.92); border-bottom:1px solid rgba(255,255,255,.08); font-family:system-ui; font-size:12.5px; color:#cbd2da; }
  #topbar .grp { display:flex; gap:6px; align-items:center; }
  #topbar .lbl { color:#6b7480; text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; }
  #topbar button { font-family:system-ui; font-size:12.5px; background:#1a1d22; color:#cbd2da; border:1px solid rgba(255,255,255,.10); padding:5px 11px; border-radius:8px; cursor:pointer; transition:.15s; }
  #topbar button:hover { background:#23272d; }
  #topbar button.on { background:var(--accent-soft); border-color:var(--accent-line); color:#fff; }
  #topbar .sep { width:1px; height:22px; background:rgba(255,255,255,.10); margin:0 4px; }

  .stage { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(1200px 700px at 50% -10%, rgba(60,90,160,.10), transparent 60%), #0b0d10; overflow:hidden; }
  .frame-wrap { transform-origin:center center; }
  .frame { background:var(--bg); border-radius:var(--r-screen); box-shadow:0 40px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04); overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .frame-pad { flex:1 1 auto; min-height:0; display:flex; padding:20px; gap:16px; }
  .frame.grid::after { content:""; position:absolute; left:20px; right:20px; top:20px; bottom:20px; pointer-events:none; z-index:6;
    background-image:repeating-linear-gradient(to bottom, var(--accent-line) 0, var(--accent-line) 1px, transparent 1px, transparent var(--u,96px)); opacity:.35; }

  .home { flex:1 1 auto; min-height:0; min-width:0; display:flex; gap:16px; width:100%; }
  .home.land { flex-direction:row; }
  .home.port { flex-direction:column; }
  .col { min-height:0; min-width:0; display:flex; flex-direction:column; gap:12px; }

  .msym { font-family:'Material Symbols Outlined'; font-weight:normal; line-height:1; display:inline-block; white-space:nowrap; direction:ltr; -webkit-font-smoothing:antialiased; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 40; font-size:30px; }
  .icph { display:inline-grid; place-items:center; width:34px; height:34px; border:1.5px dashed var(--heat); border-radius:9px; color:var(--heat); font-family:var(--mono); font-weight:700; font-size:18px; }

  /* ===== Adjuster (Focus) ===== */
  /* three vertical zones: title hugs top, value centered, controls hug bottom */
  .adj { flex:1 1 auto; min-height:0; overflow:hidden; background:var(--surface); border:1.5px solid var(--hair); border-radius:var(--r-card);
    padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .adj-top { flex:0 0 auto; display:flex; flex-direction:column; gap:10px; }
  .adj-mid { flex:1 1 auto; min-height:0; display:grid; place-items:center; }
  .adj-bot { flex:0 0 auto; display:flex; flex-direction:column; gap:12px; }
  .adj-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .adj-id { display:flex; align-items:center; gap:16px; min-width:0; }
  .adj-id .msym { font-size:calc(var(--u,96px) * 0.62); color:var(--accent-2); }
  .adj-id .nm { font-size:calc(28px*var(--fs)); font-weight:800; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .adj-desc { font-size:calc(16.5px*var(--fs)); color:var(--text-2); line-height:1.4; }
  .adj-val { display:flex; align-items:baseline; justify-content:center; gap:8px; flex:0 0 auto; padding:6px 0 2px; }
  .adj-val .num { font-family:var(--mono); font-weight:700; font-size:calc(64px*var(--fs)); letter-spacing:-.03em; line-height:1; }
  .adj-val .unit { font-family:var(--mono); font-weight:600; font-size:calc(26px*var(--fs)); color:var(--text-3); }
  .adj-live { text-align:center; font-family:var(--mono); font-size:calc(15px*var(--fs)); color:var(--text-3); margin-top:-8px; }
  /* baseline readout — inline beside the value, only once changed from entry */
  .adj-orig { font-family:var(--mono); font-size:calc(17px*var(--fs)); color:var(--text-3); align-self:baseline; margin-left:4px; }

  /* scrubber */
  .scrub { flex:0 0 auto; padding:6px 2px; }
  .scrub-track { position:relative; height:26px; border-radius:999px; background:var(--surface-3); border:1px solid var(--hair); overflow:hidden; cursor:pointer; }
  .scrub-fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); box-shadow:0 0 16px var(--accent-glow); }
  .scrub-handle { position:absolute; top:50%; width:30px; height:30px; border-radius:999px; background:var(--text); border:3px solid var(--accent); transform:translate(-50%,-50%); box-shadow:0 2px 10px rgba(0,0,0,.5); }
  .scrub-ends { display:flex; justify-content:space-between; font-family:var(--mono); font-size:calc(13px*var(--fs)); color:var(--text-3); margin-top:7px; }

  /* stepper */
  .stepper { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .stepbtn { min-height:calc(var(--u,96px) * 0.95); border-radius:var(--r-ctrl); border:2px solid var(--accent-line); background:var(--surface-2);
    color:var(--accent-2); display:grid; place-items:center; cursor:pointer; transition:.15s; }
  .stepbtn:hover { background:var(--surface-3); box-shadow:0 0 22px -3px var(--accent-glow); }
  .stepbtn:active { transform:scale(.97); }
  .stepbtn .msym { font-size:calc(var(--u,96px) * 0.7); }

  /* increment picker */
  .steps { flex:0 0 auto; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; }
  .stepsel { min-height:calc(var(--u,96px) - 16px); border-radius:var(--r-ctrl); border:1.5px solid var(--outline); background:var(--surface);
    color:var(--text-2); display:grid; place-items:center; cursor:pointer; transition:.15s; font-family:var(--mono); font-weight:700; font-size:calc(18px*var(--fs)); letter-spacing:-.02em; }
  .stepsel:hover { border-color:var(--outline-2); color:var(--text); }
  .stepsel.on { border-color:var(--accent-line); background:var(--accent-soft); color:var(--accent-2); }
  /* reset-this-setting — square icon button, top-right of the adjuster */
  .resetbtn { flex:0 0 auto; width:calc(var(--u,96px) - 16px); min-width:56px; height:calc(var(--u,96px) - 16px); border-radius:var(--r-ctrl);
    border:1.5px solid var(--heat); background:var(--surface); color:var(--heat); display:grid; place-items:center; cursor:pointer; transition:.15s; }
  .resetbtn:hover { border-color:var(--heat); background:var(--heat-soft); box-shadow:0 0 18px -3px var(--heat-glow); }
  .resetbtn .msym { font-size:calc(var(--u,96px) * 0.5); }

  /* ===== Field list ===== */
  .field-scroll { position:relative; flex:1 1 auto; min-height:0; }
  .list { height:100%; overflow-y:auto; scrollbar-width:none; display:flex; flex-direction:column; gap:12px; padding:2px; }
  .list::-webkit-scrollbar { display:none; }
  .fade { position:absolute; left:0; right:0; height:30px; pointer-events:none; z-index:3; opacity:0; transition:opacity .2s; }
  .fade.top { top:0; background:linear-gradient(180deg,var(--bg),transparent); }
  .fade.bot { bottom:0; background:linear-gradient(0deg,var(--bg),transparent); }

  /* list items TRANSLUCENT (content); controls stay filled */
  .row { flex:0 0 auto; min-height:calc(var(--u,96px) - 12px); border:1.5px solid var(--outline); border-radius:var(--r-ctrl);
    background:transparent; padding:12px 18px; display:flex; align-items:center; gap:16px; cursor:pointer; transition:.15s; }
  .row:hover { border-color:var(--outline-2); background:var(--hair); }
  .row.sel { border-color:var(--accent-line); background:var(--accent-soft); border-width:2px; }
  .row .ri { flex:0 0 auto; color:var(--text-2); display:flex; }
  .row .ri .msym { font-size:34px; }
  .row .body { flex:1 1 auto; min-width:0; }
  .row .t { font-size:calc(21px*var(--fs)); font-weight:700; letter-spacing:-.01em; }
  .row .rv { flex:0 0 auto; font-family:var(--mono); font-weight:700; font-size:calc(26px*var(--fs)); letter-spacing:-.03em; }
  .row .rv .u { color:var(--text-3); font-size:.6em; margin-left:4px; }
  .row.sel .rv { color:var(--accent-2); }

  .foot { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn { min-height:calc(var(--u,96px) - 10px); border-radius:var(--r-ctrl); border:2px solid var(--outline); background:var(--surface);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
  .btn:hover { background:var(--surface-2); }
  .btn .msym { font-size:calc(var(--u,96px) * 0.6); }
  .btn.accent { border-color:var(--accent-line); color:var(--accent-2); }
  .btn.accent:hover { box-shadow:0 0 22px -2px var(--accent-glow); }
  .btn.warn { border-color:var(--heat); color:var(--heat); }
  .btn.warn:hover { box-shadow:0 0 22px -2px var(--heat-glow); background:var(--heat-soft); }

  .ph-note { position:absolute; bottom:9px; left:16px; z-index:4; font-family:system-ui; font-size:10.5px; color:var(--text-3); opacity:.7; }

  #tools { position:fixed; bottom:12px; right:12px; z-index:60; font-family:system-ui; font-size:12px; background:rgba(0,0,0,.72); color:#fff; padding:8px 10px; border-radius:10px; opacity:.45; transition:opacity .2s; display:flex; gap:12px; align-items:center; }
  #tools:hover { opacity:1; }
  #tools .g { display:flex; gap:5px; align-items:center; }
  #tools .g span { color:#8b93a0; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  #tools button { background:#20242b; color:#dfe4ea; border:1px solid rgba(255,255,255,.12); border-radius:7px; padding:4px 9px; cursor:pointer; font-size:12px; }
  #tools button.on { background:#3457b0; border-color:#4f7dff; color:#fff; }
</style>
</head>
<body>

<div id="topbar">
  <div class="grp"><span class="lbl">Orientation</span>
    <button data-o="land" class="obtn on">Landscape</button>
    <button data-o="port" class="obtn">Portrait</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Device</span>
    <button data-d="phone" class="dbtn">Phone · 5u</button>
    <button data-d="tablet" class="dbtn on">Tablet · 7u</button>
  </div>
</div>

<div class="stage"><div class="frame-wrap" id="frameWrap"><div class="frame" id="frame"></div></div></div>

<div id="tools">
  <div class="g"><span>Theme</span><button id="thDark" class="on">Dark</button><button id="thLight">Light</button></div>
  <div class="g"><span>Text</span><button data-fs="1.0">S</button><button data-fs="1.15" class="on">M</button><button data-fs="1.32">L</button></div>
  <div class="g"><span>Unit grid</span><button id="gridBtn">Show</button></div>
</div>

<script>
let V='a', O='land', D='tablet', sel='flow';
const DEV = { phone:{landW:1180,landH:545,portW:560,portH:1180,N:5}, tablet:{landW:1180,landH:740,portW:800,portH:1180,N:7} };
const PAD=40;

const ICON = { flow:'output_circle', speed:'speed', fan:'air', z:'height', pa:'text_select_move_forward_word', accel:'sprint',
  minus:'remove', plus:'add', home:'home', resetOne:'reset_wrench', resetAll:'reset_settings' };
function ic(k){ return `<span class="msym">${ICON[k]||k}</span>`; }
function icph(fn){ return `<span class="icph" title="No registry glyph for: ${fn} — owner must assign">?</span>`; }

/* live-adjust params (Fine-Tune). stepIdx = which increment is active. */
const P = {
  flow:  { name:'Flow',         icon:'flow',  desc:'Scales how much filament is extruded. Raise to fix under-extrusion, lower to fix over-extrusion.', val:100,  unit:'%',     def:100,  min:50,  max:150,  steps:[1,5,10],          si:1, dec:0 },
  speed: { name:'Speed',        icon:'speed', desc:'Scales the overall print feedrate — every move speeds up or slows down together.',                 val:100,  unit:'%',     def:100,  min:25,  max:300,  steps:[1,5,10],          si:1, dec:0 },
  fan:   { name:'Part Fan',     icon:'fan',   desc:'Part-cooling fan duty. Higher improves overhangs but weakens layer bonding.',                     val:80,   unit:'%',     def:0,    min:0,   max:100,  steps:[5,10,25],         si:0, dec:0 },
  z:     { name:'Z Offset',     icon:'z',     desc:'Live nozzle-to-bed gap (baby-stepping). Lower squishes the first layer; raise to lift it.',        val:0.00, unit:'mm',    def:0,    min:-1,  max:1,    steps:[0.005,0.01,0.05], si:1, dec:3 },
  pa:    { name:'Pressure Adv', icon:'pa',    desc:'Compensates for filament pressure to sharpen corners and reduce ooze at seams.',                   val:0.040,unit:'',      def:0.040,min:0,   max:0.5,  steps:[0.001,0.005,0.01],si:1, dec:3 },
  accel: { name:'Max Accel',    icon:'accel', desc:'How hard motion ramps up and down. Lower is smoother with less ringing; higher prints faster.',     val:3000, unit:'mm/s²', def:3000, min:500, max:10000,steps:[100,500,1000],    si:1, dec:0 },
};
for (const k in P) P[k].orig = P[k].val;   // baseline captured on entry — drives the "was X" readout
const ORDER = ['flow','speed','fan','z','pa','accel'];
const fmt = (p,v)=> (p.dec? v.toFixed(p.dec) : Math.round(v).toString());
const clamp=(v,p)=> Math.min(p.max, Math.max(p.min, v));

function paramIcon(p){ return ic(p.icon); }

function adjusterHTML(){
  const p = P[sel];
  const stepper = `<div class="stepper">
    <button class="stepbtn" data-nudge="-1">${ic('minus')}</button>
    <button class="stepbtn" data-nudge="1">${ic('plus')}</button>
  </div>`;
  const steps = `<div class="steps">${p.steps.map((s,i)=>`<button class="stepsel ${i===p.si?'on':''}" data-step="${i}">${p.dec?('±'+s.toFixed(p.dec)):('±'+s)}</button>`).join('')}</div>`;
  return `<div class="adj">
    <div class="adj-top">
      <div class="adj-head">
        <div class="adj-id">${paramIcon(p)}<span class="nm">${p.name}</span></div>
        <button class="resetbtn" id="resetBtn" title="Reset to default (${fmt(p,p.def)}${p.unit})">${ic('resetOne')}</button>
      </div>
      <div class="adj-desc">${p.desc}</div>
    </div>
    <div class="adj-mid">
      <div class="adj-val">
        <span class="num">${fmt(p,p.val)}</span><span class="unit">${p.unit}</span>
        ${(p.val!==p.orig)?`<span class="adj-orig">was ${fmt(p,p.orig)}${p.unit}</span>`:''}
      </div>
    </div>
    <div class="adj-bot">
      ${stepper}
      ${steps}
    </div>
  </div>`;
}

function listHTML(){
  return ORDER.map(k=>{ const p=P[k];
    return `<div class="row ${k===sel?'sel':''}" data-sel="${k}">
      <span class="ri">${paramIcon(p)}</span>
      <div class="body"><div class="t">${p.name}</div></div>
      <div class="rv">${fmt(p,p.val)}<span class="u">${p.unit}</span></div>
    </div>`;
  }).join('');
}
function footHTML(){ return `<div class="foot">
  <button class="btn accent" title="Home">${ic('home')}</button>
  <button class="btn warn" title="Reset all to defaults">${ic('resetAll')}</button>
</div>`; }

function fieldHTML(){
  return `<div class="col" style="flex:1 1 0">
    <div class="field-scroll"><div class="fade top"></div><div class="list">${listHTML()}</div><div class="fade bot"></div></div>
    ${footHTML()}
  </div>`;
}

function render(){
  const f=document.getElementById('frame'); let home;
  const focusFlex = O==='land' ? '0 1 50%' : '1 1 0';
  const focus = `<div class="col" style="flex:${focusFlex}">${adjusterHTML()}</div>`;
  home = `<div class="home ${O}">${focus}${fieldHTML()}</div>`;
  f.innerHTML = `<div class="frame-pad">${home}</div><div class="ph-note">icons = registry glyphs (Material Symbols) · step-based adjuster (no scrubber)</div>`;
  sizeFrame(); wire();
}

function sizeFrame(){
  const frame=document.getElementById('frame'), wrap=document.getElementById('frameWrap'), d=DEV[D];
  const W=O==='land'?d.landW:d.portW, H=O==='land'?d.landH:d.portH;
  frame.style.width=W+'px'; frame.style.height=H+'px';
  document.documentElement.style.setProperty('--u', ((d.landH-PAD)/d.N).toFixed(1)+'px');
  const s=Math.min((window.innerWidth-60)/W,(window.innerHeight-130)/H,1); wrap.style.transform=`scale(${s})`;
}

function wire(){
  document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ sel=b.dataset.sel; render(); });
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ P[sel].si=+b.dataset.step; render(); });
  document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{ const p=P[sel]; p.val=clamp(+(p.val + b.dataset.nudge*p.steps[p.si]).toFixed(6), p); render(); });
  const rb=document.getElementById('resetBtn'); if(rb) rb.onclick=()=>{ P[sel].val=P[sel].def; render(); };
  // scrubber drag
  const track=document.getElementById('track');
  if(track){ const p=P[sel];
    const setFromX=(clientX)=>{ const r=track.getBoundingClientRect(); let frac=(clientX-r.left)/r.width; frac=Math.min(1,Math.max(0,frac));
      let v=p.min+frac*(p.max-p.min); const st=p.steps[p.si]; v=Math.round(v/st)*st; p.val=clamp(+v.toFixed(6),p); render(); };
    track.onpointerdown=(e)=>{ track.setPointerCapture(e.pointerId); setFromX(e.clientX);
      track.onpointermove=(ev)=>setFromX(ev.clientX); track.onpointerup=()=>{ track.onpointermove=null; }; };
  }
  document.querySelectorAll('.field-scroll').forEach(fs=>{ const l=fs.querySelector('.list'),t=fs.querySelector('.fade.top'),bt=fs.querySelector('.fade.bot');
    const u=()=>{ const m=l.scrollHeight-l.clientHeight; t.style.opacity=l.scrollTop>4?'1':'0'; bt.style.opacity=(m>4&&l.scrollTop<m-4)?'1':'0'; }; l.addEventListener('scroll',u); u(); });
}

function setA(sel2,attr,val){ document.querySelectorAll(sel2).forEach(b=>b.classList.toggle('on',b.getAttribute(attr)===val)); }
document.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{V=b.dataset.v; setA('.vbtn','data-v',V); render();});
document.querySelectorAll('.obtn').forEach(b=>b.onclick=()=>{O=b.dataset.o; setA('.obtn','data-o',O); render();});
document.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>{D=b.dataset.d; setA('.dbtn','data-d',D); render();});
document.getElementById('thDark').onclick=()=>{document.documentElement.removeAttribute('data-theme'); document.getElementById('thDark').classList.add('on'); document.getElementById('thLight').classList.remove('on');};
document.getElementById('thLight').onclick=()=>{document.documentElement.setAttribute('data-theme','light'); document.getElementById('thLight').classList.add('on'); document.getElementById('thDark').classList.remove('on');};
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--fs',b.dataset.fs); document.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',x===b)); sizeFrame();});
document.getElementById('gridBtn').onclick=(e)=>{const on=document.getElementById('frame').classList.toggle('grid'); e.target.classList.toggle('on',on); e.target.textContent=on?'Hide':'Show';};
window.addEventListener('resize',sizeFrame);
render();
</script>
</body>
</html>
