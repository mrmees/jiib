<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>001 — Waterfall Home (morphing Focus/Field root)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../themes/default.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---------- chrome (sketch controls, not part of the design) ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px;
    background: rgba(10,12,16,.92);
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-family: system-ui; font-size: 12.5px; color: #cbd2da;
  }
  #topbar .grp { display: flex; gap: 6px; align-items: center; }
  #topbar .lbl { color: #6b7480; text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; }
  #topbar button {
    font-family: system-ui; font-size: 12.5px;
    background: #1a1d22; color: #cbd2da; border: 1px solid rgba(255,255,255,.10);
    padding: 5px 11px; border-radius: 8px; cursor: pointer; transition: .15s;
  }
  #topbar button:hover { background: #23272d; }
  #topbar button.on { background: var(--accent-soft); border-color: var(--accent-line); color: #fff; }
  #topbar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.10); margin: 0 4px; }

  .stage {
    position: fixed; inset: 0; top: 0;
    display: grid; place-items: center;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(60,90,160,.10), transparent 60%),
      #0b0d10;
    overflow: hidden;
  }
  .frame-wrap { transform-origin: center center; }
  .frame {
    background: var(--bg);
    border-radius: var(--r-screen);
    box-shadow: 0 40px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04);
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .frame-pad { flex: 1 1 auto; min-height: 0; display: flex; padding: 20px; gap: 16px; }

  /* unit-grid debug overlay — faint line every U, anchored to the content padding */
  .frame.grid::after {
    content: ""; position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px;
    pointer-events: none; z-index: 6;
    background-image: repeating-linear-gradient(to bottom,
      var(--accent-line) 0, var(--accent-line) 1px,
      transparent 1px, transparent var(--u, 96px));
    opacity: .35;
  }

  /* ---------- HOME layout: Focus / Field (NO gutter) ---------- */
  .home { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; gap: 16px; width: 100%; }
  .home.land { flex-direction: row; }
  .home.port { flex-direction: column; }

  .focus { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .field { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  /* ===== component class: DetailCard / FocusCard ===== */
  .focus-card {
    flex: 1 1 auto; min-height: 0;
    background: var(--surface);
    border: 1.5px solid var(--hair);
    border-radius: var(--r-card);
    padding: 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
    position: relative; overflow: hidden;
  }
  .focus-bare { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px; }

  .f-eyebrow { font-size: calc(13px * var(--fs)); color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  /* thin secondary line — for data that doesn't warrant a pill (layer, last-print) */
  .f-meta { font-family: var(--mono); font-size: calc(17px * var(--fs)); color: var(--text-3); letter-spacing: -.01em; }
  .f-title { font-size: calc(30px * var(--fs)); font-weight: 800; letter-spacing: -.02em; line-height: 1.02; }
  .f-title.go { color: var(--go); }
  .status-dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; vertical-align: middle; margin-right: 10px; box-shadow: 0 0 12px currentColor; }

  .thumb {
    border-radius: 14px; flex: 1 1 auto; min-height: 90px;
    background:
      radial-gradient(120px 120px at 38% 40%, rgba(120,160,255,.30), transparent 60%),
      conic-gradient(from 210deg at 60% 55%, #2a3550, #1b2335 40%, #2f3c5c 70%, #1b2335);
    border: 1px solid var(--hair);
    position: relative; overflow: hidden;
    display: grid; place-items: center;
  }
  .thumb .benchy { font-size: 54px; opacity: .5; filter: grayscale(.2); }

  .bignum { font-family: var(--mono); font-weight: 700; letter-spacing: -.03em; }
  .pct-big { font-size: calc(46px * var(--fs)); }
  .progress { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 14px var(--accent-glow); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: calc(20px * var(--fs)); font-weight: 600;
    color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--hair);
    padding: 9px 15px; border-radius: 13px;
  }
  .chip .k { font-size: calc(15px * var(--fs)); }
  .chip b { color: var(--text); font-weight: 700; }
  .chip.heat b { color: var(--heat); }
  .chip .k { color: var(--text-3); font-weight: 600; }

  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin-top: 4px; }
  .statgrid .s { display: flex; flex-direction: column; gap: 2px; }
  .statgrid .s .k { font-size: calc(12.5px * var(--fs)); color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .statgrid .s .v { font-family: var(--mono); font-size: calc(22px * var(--fs)); font-weight: 700; letter-spacing: -.02em; }

  /* ===== component class: List (no scrollbar, edge-fade hints) ===== */
  .field-scroll { position: relative; flex: 1 1 auto; min-height: 0; }
  .list { height: 100%; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; padding: 2px; }
  .list::-webkit-scrollbar { display: none; }
  .fade { position: absolute; left: 0; right: 0; height: 30px; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .2s; }
  .fade.top { top: 0; background: linear-gradient(180deg, var(--bg), transparent); }
  .fade.bot { bottom: 0; background: linear-gradient(0deg, var(--bg), transparent); }
  .focus-card .fade.top { background: linear-gradient(180deg, var(--surface), transparent); }
  .focus-card .fade.bot { background: linear-gradient(0deg, var(--surface), transparent); }

  /* ===== component class: ListRow ===== */
  .row {
    flex: 0 0 auto;
    /* one standard UNIT tall (minus the inter-row gap) */
    min-height: calc(var(--u, 96px) - 12px);
    border: 1.5px solid var(--outline);
    border-radius: var(--r-ctrl);
    background: var(--surface);
    padding: 12px 18px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; transition: .15s;
  }
  .row:hover { border-color: var(--outline-2); background: var(--surface-2); }
  .row.hero { min-height: 0; padding: 18px 20px; }
  .row .mark {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 11px;
    background: var(--surface-2); border: 1px solid var(--hair);
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--text-2);
  }
  .row .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row .t { font-size: calc(21px * var(--fs)); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: calc(16px * var(--fs)); color: var(--text-3); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { flex: 0 0 auto; color: var(--text-3); font-size: 24px; line-height: 1; }
  .row .hint { flex: 0 0 auto; font-family: var(--mono); font-weight: 600; font-size: calc(19px * var(--fs)); color: var(--text-2); }

  /* ===== component class: stat row (print-complete Field) ===== */
  .row.stat { cursor: default; }
  .row.stat:hover { border-color: var(--outline); background: var(--surface); }
  .row.stat .statval { flex: 0 0 auto; font-family: var(--mono); font-weight: 700; font-size: calc(23px * var(--fs)); letter-spacing: -.02em; }

  .thumb.brand {
    background:
      radial-gradient(160px 160px at 50% 42%, var(--accent-soft), transparent 65%),
      var(--surface-2);
  }
  .thumb.brand .jiib { font-family: var(--ui); font-weight: 900; font-size: 64px; letter-spacing: -.03em; color: var(--accent-2); opacity: .9; }
  .f-row { display: flex; align-items: center; gap: 4px; }
  .row .hint.heat { color: var(--heat); }
  .row .hint.go { color: var(--go); }

  /* ===== component class: FootButtonBar ===== */
  .foot { flex: 0 0 auto; display: grid; gap: 12px; margin-top: 2px; }
  .foot.n2 { grid-template-columns: 1fr 1fr; }
  .foot.n3 { grid-template-columns: 1fr 1fr 1fr; }
  .btn {
    /* foot buttons are also one UNIT tall */
    min-height: calc(var(--u, 96px) - 10px); border-radius: var(--r-ctrl);
    border: 2px solid var(--outline); background: var(--surface);
    color: var(--text); font-family: var(--ui); font-weight: 700;
    font-size: calc(17px * var(--fs)); letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    cursor: pointer; transition: .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn .sub { font-family: var(--mono); font-weight: 500; font-size: calc(12px*var(--fs)); color: var(--text-3); }
  .btn.accent  { border-color: var(--accent-line); color: var(--accent-2); box-shadow: 0 0 0 0 var(--accent-glow); }
  .btn.accent:hover  { box-shadow: 0 0 22px -2px var(--accent-glow); }
  .btn.go      { border-color: color-mix(in oklch, var(--go) 60%, var(--outline)); color: var(--go); }
  .btn.go:hover{ box-shadow: 0 0 22px -2px var(--go-glow); background: var(--go-soft); }
  .btn.caution { border-color: color-mix(in oklch, var(--heat) 62%, var(--outline)); color: var(--heat); }
  .btn.caution:hover { box-shadow: 0 0 22px -2px var(--heat-glow); background: var(--heat-soft); }
  .btn.stop    { border-color: color-mix(in oklch, var(--stop) 66%, var(--outline)); color: var(--stop); }
  .btn.stop:hover { box-shadow: 0 0 22px -2px var(--stop-glow); background: var(--stop-soft); }

  /* ===== component class: FloatingEStop (printing only) ===== */
  .estop {
    position: absolute; z-index: 20;
    width: 80px; height: 80px; border-radius: 999px;
    background: var(--stop-soft);
    border: 2.5px solid var(--stop);
    color: var(--stop);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-weight: 800; letter-spacing: .02em;
    box-shadow: 0 0 30px -4px var(--stop-glow), inset 0 0 18px -8px var(--stop-glow);
    cursor: pointer; transition: .15s;
    backdrop-filter: blur(3px);
  }
  .estop:hover { background: var(--stop); color: #fff; box-shadow: 0 0 40px 0 var(--stop-glow); }
  .estop .ring { font-size: 23px; line-height: 1; }
  .estop .lab { font-size: 11px; font-family: var(--ui); }
  /* e-stop floats at the TOP-LEFT of the focus area, over the main display item */
  .focus-card .estop, .hero .estop { top: 14px; left: 14px; }

  /* placeholder-icon disclaimer */
  .ph-note {
    position: absolute; bottom: 9px; left: 16px; z-index: 4;
    font-family: system-ui; font-size: 10.5px; color: var(--text-3); opacity: .7; letter-spacing: .01em;
  }

  /* sketch toolbar */
  #tools {
    position: fixed; bottom: 12px; right: 12px; z-index: 60;
    font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,.72); color: #fff; padding: 8px 10px; border-radius: 10px;
    opacity: .45; transition: opacity .2s; display: flex; gap: 12px; align-items: center;
  }
  #tools:hover { opacity: 1; }
  #tools .g { display: flex; gap: 5px; align-items: center; }
  #tools .g span { color: #8b93a0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
  #tools button { background: #20242b; color: #dfe4ea; border: 1px solid rgba(255,255,255,.12); border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
  #tools button.on { background: #3457b0; border-color: #4f7dff; color: #fff; }
</style>
</head>
<body>

<div id="topbar">
  <div class="grp"><span class="lbl">Variant</span>
    <button data-v="a" class="vbtn on">A · Focus-as-card ★</button>
    <button data-v="b" class="vbtn">B · One-list (hero row)</button>
    <button data-v="c" class="vbtn">C · State-driven split</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Printer state</span>
    <button data-s="idle" class="sbtn on">Idle</button>
    <button data-s="printing" class="sbtn">Printing</button>
    <button data-s="terminal" class="sbtn">Complete</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Orientation</span>
    <button data-o="land" class="obtn on">Landscape</button>
    <button data-o="port" class="obtn">Portrait</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Device (units)</span>
    <button data-d="phone" class="dbtn">Phone · 5u</button>
    <button data-d="tablet" class="dbtn on">Tablet · 7u</button>
  </div>
</div>

<div class="stage">
  <div class="frame-wrap" id="frameWrap">
    <div class="frame" id="frame"></div>
  </div>
</div>

<div id="tools">
  <div class="g"><span>Theme</span>
    <button id="thDark" class="on">Dark</button>
    <button id="thLight">Light</button>
  </div>
  <div class="g"><span>Text</span>
    <button data-fs="1.0">S</button>
    <button data-fs="1.15" class="on">M</button>
    <button data-fs="1.32">L</button>
  </div>
  <div class="g"><span>Unit grid</span>
    <button id="gridBtn">Show</button>
  </div>
</div>

<script>
/* ----------------------------------------------------------------
   STATE
----------------------------------------------------------------- */
let V = 'a', S = 'idle', O = 'land', D = 'tablet';

/* device presets — landscape is short on phones (tall aspect), roomier on a tablet.
   N = units that fit the CONSTRAINED (landscape) height: 5 (phone floor) → 7 (tablet). */
const DEV = {
  phone:  { landW: 1180, landH: 545, portW: 560, portH: 1180, N: 5 },
  tablet: { landW: 1180, landH: 740, portW: 800, portH: 1180, N: 7 },
};
const PAD = 40; // frame-pad 20px * 2

/* ----------------------------------------------------------------
   DATA  (real-ish — Ender 5 Plus printing a Benchy)
----------------------------------------------------------------- */
const PRINT = {
  file: 'Benchy_0.2_PLA_x4.gcode',
  pct: 47, layer: 88, layers: 210,
  eta: '1h 12m', elapsed: '1h 03m',
  noz: [218, 220], bed: [60, 60],
  z: '17.60', speed: 100, flow: 100
};
const DONE = {
  file: 'Benchy_0.2_PLA_x4.gcode',
  result: 'Print Complete',
  time: '2h 15m', filament: '14.8 m · 44 g',
  maxNoz: 221, maxBed: 60, layers: 210, finished: '14:32'
};

// idle = FULL action list; printing = NARROWED. Each row carries a live state hint.
const ACTIONS_IDLE = [
  { t:'Move',        s:'all axes homed',        hint:'XYZ', hk:'go' },
  { t:'Temperature', s:'heaters off',           hint:'24° / 23°' },
  { t:'Extrude',     s:'filament loaded',       hint:'PLA' },
  { t:'Files',       s:'recent prints',         hint:'12' },
  { t:'Macros',      s:'saved + bookmarked',    hint:'8' },
  { t:'Fine-Tune',   s:'flow · speed · PA',     hint:'100%' },
  { t:'Console',     s:'gcode terminal',        hint:'ok' },
  { t:'Webcam',      s:'nozzle cam',            hint:'live', hk:'go' },
  { t:'Bed Mesh',    s:'last profile: default', hint:'saved' },
  { t:'Calibration', s:'PID · Z-offset · screws', hint:'' },
];
const ACTIONS_PRINT = [
  { t:'Temperature', s:'nozzle / bed',          hint:'218° / 60°', hk:'heat' },
  { t:'Fine-Tune',   s:'flow · speed · Z-babystep', hint:'100%' },
  { t:'Macros',      s:'M600 · park · purge',   hint:'8' },
  { t:'Console',     s:'gcode terminal',        hint:'printing' },
  { t:'Webcam',      s:'nozzle cam',            hint:'live', hk:'go' },
];

/* ----------------------------------------------------------------
   BUILDERS
----------------------------------------------------------------- */
function rowHTML(a, hero=false){
  const hint = a.hint ? `<span class="hint ${a.hk||''}">${a.hint}</span>` : '';
  return `<div class="row ${hero?'hero':''}">
    <div class="mark">${a.t[0]}</div>
    <div class="body"><div class="t">${a.t}</div><div class="s">${a.s}</div></div>
    ${hint}<div class="chev">›</div>
  </div>`;
}

/* Focus ALWAYS leads with the main display item (preview / jiib icon); useful info comes AFTER,
   so the floating e-stop (top-left) never covers anything that matters. */
function focusInner(){
  if (S === 'idle'){
    return `
      <div class="thumb brand"><div class="jiib">jiib</div></div>
      <div class="f-row"><span class="status-dot" style="color:var(--go)"></span><span class="f-title">Idle · Ready</span></div>
      <div class="f-meta">Last: Benchy ×4 · 2h 15m · finished 14:32</div>`;
  }
  if (S === 'printing'){
    return `
      <div class="thumb"><div class="benchy">⛵</div></div>
      <div class="f-eyebrow">Printing · ${PRINT.file}</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
        <div class="bignum pct-big">${PRINT.pct}<span style="font-size:.5em;color:var(--text-3)">%</span></div>
        <div style="text-align:right">
          <div class="f-eyebrow" style="margin-bottom:2px">remaining</div>
          <div class="bignum" style="font-size:calc(26px*var(--fs))">${PRINT.eta}</div>
        </div>
      </div>
      <div class="progress"><i style="width:${PRINT.pct}%"></i></div>
      <div class="f-meta">Layer ${PRINT.layer} / ${PRINT.layers} · Z ${PRINT.z} · ${PRINT.elapsed} elapsed</div>`;
  }
  // complete — same shape as printing; STATS move into the Field (see render)
  return `
    <div class="thumb"><div class="benchy">⛵</div></div>
    <div class="f-row"><span class="status-dot" style="color:var(--go)"></span><span class="f-title go">Print Complete</span></div>
    <div class="f-eyebrow">${DONE.file}</div>`;
}

function estopHTML(){
  return S === 'printing'
    ? `<div class="estop" title="Emergency stop"><div class="ring">⏹</div><div class="lab">E-STOP</div></div>`
    : '';
}

function statsRowsHTML(){
  const stats = [
    ['Total time',   DONE.time],
    ['Filament used',DONE.filament],
    ['Layers',       DONE.layers],
    ['Max nozzle',   DONE.maxNoz + '°'],
    ['Max bed',      DONE.maxBed + '°'],
    ['Finished at',  DONE.finished],
  ];
  return stats.map(([k,v]) =>
    `<div class="row stat"><div class="body"><div class="t">${k}</div></div><div class="statval">${v}</div></div>`
  ).join('');
}

function footHTML(){
  if (S === 'idle')
    return `<div class="foot n3">
      <button class="btn accent">Preheat</button>
      <button class="btn">Change Spool</button>
      <button class="btn caution">Power<span class="sub">off</span></button>
    </div>`;
  if (S === 'printing')
    return `<div class="foot n2">
      <button class="btn caution">Pause</button>
      <button class="btn stop">Cancel</button>
    </div>`;
  return `<div class="foot n2">
      <button class="btn">Dismiss</button>
      <button class="btn go">Reprint</button>
    </div>`;
}

function listBlock(rows, onSurface=false){
  const fadeClass = onSurface ? '' : '';
  return `<div class="field-scroll">
      <div class="fade top"></div>
      <div class="list">${rows}</div>
      <div class="fade bot"></div>
    </div>`;
}

/* ----------------------------------------------------------------
   LAYOUTS PER VARIANT
----------------------------------------------------------------- */
function render(){
  const f = document.getElementById('frame');
  const actions = S === 'printing' ? ACTIONS_PRINT : ACTIONS_IDLE;
  const rows = actions.map(a => rowHTML(a)).join('');
  // Complete keeps the printing LAYOUT but the Field shows print STATS instead of the action list.
  const fieldRows = (S === 'terminal') ? statsRowsHTML() : rows;
  let home = '';

  if (V === 'a'){
    // Focus card + Field list. Landscape ≈44/56 (good); portrait ~50/50.
    const focusFlex = O === 'land' ? '0 1 44%' : '1 1 0';
    const focus = `<div class="focus" style="flex:${focusFlex}">
        <div class="focus-card">${estopHTML()}${focusInner()}</div>
      </div>`;
    const field = `<div class="field" style="flex:1 1 0">${listBlock(fieldRows)}${footHTML()}</div>`;
    home = `<div class="home ${O}">${focus}${field}</div>`;
  }

  else if (V === 'b'){
    // ONE continuous list: Focus is the oversized hero row at the top of the same column.
    const hero = `<div class="row hero" style="flex-direction:column;align-items:stretch;gap:12px;cursor:default;position:relative">${estopHTML()}${focusInner()}</div>`;
    const inner = hero + fieldRows;
    const col = `<div class="focus" style="flex:1 1 0;max-width:${O==='land'?'640px':'none'};margin:0 auto;width:100%">
        ${listBlock(inner)}
        ${footHTML()}
      </div>`;
    home = `<div class="home port">${col}</div>`; // single column regardless of orientation
  }

  else { // V === 'c'
    // State drives the split ratio. Printing → Focus dominant. Idle → list dominant.
    let ff, fl;
    if (S==='printing'){ ff = O==='land' ? '1.5' : '1.3'; fl = '1'; }
    else if (S==='idle'){ ff = O==='land' ? '0.62' : '0.5'; fl = '1.5'; }
    else { ff = '1'; fl = '1'; }
    const focus = `<div class="focus" style="flex:${ff} 1 0">
        <div class="focus-card">${estopHTML()}${focusInner()}</div>
      </div>`;
    const field = `<div class="field" style="flex:${fl} 1 0">${listBlock(fieldRows)}${footHTML()}</div>`;
    home = `<div class="home ${O}">${focus}${field}</div>`;
  }

  f.innerHTML = `<div class="frame-pad">${home}</div>
    <div class="ph-note">placeholder markers — real icons TBD with owner</div>`;

  sizeFrame();
  wireFades();
}

/* ----------------------------------------------------------------
   FRAME SIZING (scale to fit the stage)
----------------------------------------------------------------- */
function sizeFrame(){
  const frame = document.getElementById('frame');
  const wrap = document.getElementById('frameWrap');
  const d = DEV[D];
  const W = O === 'land' ? d.landW : d.portW;
  const H = O === 'land' ? d.landH : d.portH;
  frame.style.width = W + 'px';
  frame.style.height = H + 'px';

  /* THE UNIT: derived from the LANDSCAPE content height and held constant through rotation,
     so a 1U row is the same physical height whether portrait or landscape. Portrait simply
     shows more units and scrolls. */
  const U = (d.landH - PAD) / d.N;
  document.documentElement.style.setProperty('--u', U.toFixed(1) + 'px');

  const availW = window.innerWidth - 60;
  const availH = window.innerHeight - 130;
  const s = Math.min(availW / W, availH / H, 1);
  wrap.style.transform = `scale(${s})`;
}

/* edge-fade hints: show top fade only when scrolled down, bottom only when more below */
function wireFades(){
  document.querySelectorAll('.field-scroll').forEach(fs => {
    const list = fs.querySelector('.list');
    const top = fs.querySelector('.fade.top');
    const bot = fs.querySelector('.fade.bot');
    const upd = () => {
      const max = list.scrollHeight - list.clientHeight;
      top.style.opacity = list.scrollTop > 4 ? '1' : '0';
      bot.style.opacity = (max > 4 && list.scrollTop < max - 4) ? '1' : '0';
    };
    list.addEventListener('scroll', upd);
    upd();
  });
}

/* ----------------------------------------------------------------
   WIRING
----------------------------------------------------------------- */
function setActive(sel, attr, val){
  document.querySelectorAll(sel).forEach(b => b.classList.toggle('on', b.getAttribute(attr) === val));
}
document.querySelectorAll('.vbtn').forEach(b => b.onclick = () => { V = b.dataset.v; setActive('.vbtn','data-v',V); render(); });
document.querySelectorAll('.sbtn').forEach(b => b.onclick = () => { S = b.dataset.s; setActive('.sbtn','data-s',S); render(); });
document.querySelectorAll('.obtn').forEach(b => b.onclick = () => { O = b.dataset.o; setActive('.obtn','data-o',O); render(); });
document.querySelectorAll('.dbtn').forEach(b => b.onclick = () => { D = b.dataset.d; setActive('.dbtn','data-d',D); render(); });
document.getElementById('gridBtn').onclick = (e) => {
  const on = document.getElementById('frame').classList.toggle('grid');
  e.target.classList.toggle('on', on); e.target.textContent = on ? 'Hide' : 'Show';
};

// theme + text-size tools
document.getElementById('thDark').onclick  = () => { document.documentElement.removeAttribute('data-theme'); thTog(true); };
document.getElementById('thLight').onclick = () => { document.documentElement.setAttribute('data-theme','light'); thTog(false); };
function thTog(dark){ document.getElementById('thDark').classList.toggle('on',dark); document.getElementById('thLight').classList.toggle('on',!dark); }
document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
  document.documentElement.style.setProperty('--fs', b.dataset.fs);
  document.querySelectorAll('[data-fs]').forEach(x => x.classList.toggle('on', x===b));
  sizeFrame();
});

window.addEventListener('resize', sizeFrame);
render();
</script>
