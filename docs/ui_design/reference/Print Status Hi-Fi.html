<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Status — Hi-Fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hifi.css">
<style>
  html,body{margin:0;background:#15130f;}
  /* spec sheet uses the same tokens */
  .spec{ width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--ui); padding:26px 26px 24px; overflow:hidden;
    border-radius:var(--r-screen); display:flex; flex-direction:column; gap:20px; letter-spacing:-0.01em;}
  .spec h1{ font-size:23px; font-weight:600; margin:0; letter-spacing:-0.02em;}
  .spec .sub{ color:var(--text-2); font-size:14px; margin-top:4px; line-height:1.45;}
  .spec .blk{ }
  .spec .h{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:11px; font-weight:600;}
  .swrow{ display:flex; gap:9px; flex-wrap:wrap;}
  .sw{ display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .sw .chip-c{ width:48px; height:40px; border-radius:11px; border:1px solid var(--hair);}
  .sw small{ font-size:11px; color:var(--text-3); font-family:var(--mono);}
  .typ .big{ font-size:34px; font-weight:600; letter-spacing:-0.03em; line-height:1;}
  .typ .mid{ font-size:18px; font-weight:500; margin-top:7px;}
  .typ .mn{ font-family:var(--mono); font-size:15px; color:var(--text-2); margin-top:7px;}
  .ctlrow{ display:flex; gap:10px; flex-wrap:wrap;}
  .principle{ border:1px dashed var(--outline); border-radius:14px; padding:13px 14px; color:var(--text-2);
    font-size:13.5px; line-height:1.5;}
  .principle b{ color:var(--text);}

  /* S/M/L text-size setting (demonstrates an in-app user preference) */
  .fsbar{ position:fixed; top:14px; right:16px; z-index:100; display:flex; align-items:center; gap:9px;
    background:#1b1f27; border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:6px 8px 6px 15px;
    font-family:'Geist',system-ui,sans-serif; box-shadow:0 8px 24px -10px rgba(0,0,0,.7);}
  .fsbar .fsl{ font-size:11px; color:#9aa3b2; letter-spacing:.07em; text-transform:uppercase; font-weight:600;}
  .fsbar button{ font-family:inherit; border:1.5px solid rgba(255,255,255,.16); background:transparent; color:#e8ecf2;
    width:36px; height:36px; border-radius:999px; cursor:pointer; font-size:15px; font-weight:600; transition:.12s;}
  .fsbar button:hover{ border-color:rgba(255,255,255,.3);}
  .fsbar button.on{ border-color:var(--accent); color:var(--accent-2); background:var(--accent-soft);}
</style>
</head>
<body>

<div class="fsbar" role="group" aria-label="Text size">
  <span class="fsl">Text</span>
  <button data-fs="1">S</button>
  <button data-fs="1.15" class="on">M</button>
  <button data-fs="1.32">L</button>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { useState } = React;

/* ---------- icons (line glyphs only) ---------- */

const ICheckS = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>);

const IChevUp = () => (<svg className="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 15l7-7 7 7"/></svg>);

const IGauge = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19a8 8 0 1 1 16 0"/><path d="M12 19l4.5-5.5"/></svg>);
const IMove = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2.4 2.4M12 3l2.4 2.4M12 21l-2.4-2.4M12 21l2.4-2.4M3 12l2.4-2.4M3 12l2.4 2.4M21 12l-2.4-2.4M21 12l-2.4 2.4"/></svg>);
const ITherm = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>);
const IWrench = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 6a3.5 3.5 0 0 0 4.6 4.3l-9 9a2.1 2.1 0 0 1-3-3l9-9A3.5 3.5 0 0 0 14.5 6z"/></svg>);
const IZap = () => (<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>);
const IPlug = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></svg>);
const IGear = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>);
const IFiles = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>);

const ICheckCircle = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>);
const ISnow = () => (<svg className="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20M4 7l16 10M20 7 4 17"/></svg>);
const IList = () => (<svg className="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>);

/* ---------- shared bits ---------- */
const Printer = () => (
  <div className="ppill"><span className="av">V2</span>Voron 2.4<span className="car">▾</span></div>
);
const Conn = () => (<span className="conn"><IWifi/>online</span>);
const Status = () => (<span className="status"><span className="dot"></span>Printing</span>);

const Header = () => (<div className="hdr"><Printer/><Conn/></div>);

function Ring({pct=68, size=226, sw=12, children}){
  const r = (size/2) - sw/2 - 1;
  const circ = 2*Math.PI*r;
  const arc = circ*pct/100;
  return (
    <svg className="prog" viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle className="trk" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={sw}/>
      <circle className="arc" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={sw}
        strokeDasharray={`${arc} ${circ}`} strokeDashoffset="0" style={{['--circ']:circ}}/>
    </svg>
  );
}

const Preview = ({id, shape="rounded", radius=14, style}) => (
  <image-slot id={id} shape={shape} radius={String(radius)} fit="cover"
    placeholder="Drop print preview" style={{display:'block', ...style}}></image-slot>
);

/* ============================================================
   LAYOUT GRAMMAR instance — Print Status
   Focus = ring · Field = info grid · Gutter = actions
   ============================================================ */
function FocusBlock({pid}){
  return (
    <div className="focus">
      <div className="ringblock">
        <div className="ringwrap">
          <Ring pct={68} size={178} sw={11}/>
          <Preview id={pid} shape="circle" style={{position:'absolute', inset:'12.5%', width:'75%', height:'75%'}}/>
          <div className="badge">68%</div>
        </div>
        <div className="timeblock">
          <div className="lbl" style={{marginBottom:'1px'}}>Time remaining</div>
          <div className="hero">1:15</div>
          <div className="fmeta">
            <span className="fname">Benchy.gcode</span>
            <Status/>
          </div>
          <button className="printer-min">Voron 2.4 · online <span className="car">▾</span></button>
        </div>
      </div>
    </div>
  );
}
function FieldBlock(){
  return (
    <div className="field">
      <div className="statgrid">
        <div className="s"><span className="lbl">Layer</span><span className="v mono">142 / 209</span></div>
        <div className="s"><span className="lbl">Filament</span><span className="v mono">4.2 m</span></div>
        <div className="s"><span className="lbl">Nozzle</span><span className="v"><span style={{color:'var(--heat)'}}>210°</span> <span className="faint" style={{fontSize:'0.62em'}}>/ 210</span></span></div>
        <div className="s"><span className="lbl">Bed</span><span className="v"><span style={{color:'var(--heat)'}}>60°</span> <span className="faint" style={{fontSize:'0.62em'}}>/ 60</span></span></div>
        <div className="s"><span className="lbl">Elapsed</span><span className="v mono">2:30</span></div>
        <div className="s"><span className="lbl">Finish by</span><span className="v mono">18:42</span></div>
      </div>
    </div>
  );
}
function Gutter(){
  return (
    <div className="gutter">
      <button className="ctl"><ITune/>Tune</button>
      <button className="ctl accent"><IPause/>Pause</button>
      <button className="ctl danger grow"><IStop/>Stop</button>
    </div>
  );
}
function PrintStatus({land, light}){
  return (
    <div className={"screen " + (land ? "land" : "port") + (light ? " light" : "")}>
      <div className="stage">
        <FocusBlock pid={land ? "ps-pre-l" : "ps-pre-p"}/>
        <FieldBlock/>
      </div>
      <Gutter/>
    </div>
  );
}

/* ============================================================
   SCREW-TILT calibration — Focus = live bed diagram · Field = actions
   (no Gutter on this tool page)
   ============================================================ */
function Bed(){
  return (
    <div className="bed">
      <div className="bed-center">
        <span className="bc-state">2 of 4 in tolerance</span>
        <span className="bc-hint">adjust the highlighted screw, then re-probe</span>
      </div>
      <div className="screw tl base"><div className="knob"><IDotS/></div><span className="turn">base</span></div>
      <div className="screw tr adjust active"><div className="knob"><ICW/></div><span className="turn">CW 0:25</span></div>
      <div className="screw bl adjust"><div className="knob"><ICCW/></div><span className="turn">CCW 0:10</span></div>
      <div className="screw br ok"><div className="knob"><ICheckS/></div><span className="turn">in tol.</span></div>
    </div>
  );
}
function ScrewTilt({land}){
  return (
    <div className={"screen " + (land ? "land" : "port")}>
      <div className="stage">
        <div className="focus">
          <Bed/>
        </div>
        <div className="field">
          <div className="btngrid">
            <button className="ctl accent"><IPlay/>Initiate</button>
            <button className="ctl"><IRefresh/>Adjust</button>
            <button className="ctl go"><ICheckB/>Accept</button>
            <button className="ctl danger"><IX/>Cancel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   A — STACKED CALM
   ============================================================ */
function PS_A(){

    <div className="scr v-a">

      <div className="body">

          <div className="col grow1 between" style={{minWidth:0}}>
            <div className="row between center"><span className="fname">Benchy.gcode</span><Status/></div>
            <div className="col gap6">

                <span className="pct">68<span style={{fontSize:'16px',color:'var(--text-2)'}}>%</span></span>
                <span className="mono faint" style={{fontSize:'13px'}}>142 / 209 layers</span>
              </div>
              <div className="bar"><i style={{['--p']:'68%'}}></i></div>
            </div>
          </div>
        </div>
      </div>

      <div className="card row between center">
        <div className="col gap6"><span className="lbl">Time remaining</span><span className="hero">1:15</span></div>
        <div className="col gap6" style={{alignItems:'flex-end'}}><span className="lbl">Finish by</span><span className="mono" style={{fontSize:'19px',fontWeight:600}}>18:42</span></div>
      </div>

      <div className="card">
        <div className="lbl" style={{marginBottom:'12px'}}>Temperatures</div>
        <div className="temps">
          <div className="temp">
            <div className="top"><span className="ic"></span><span className="now">210°</span><span className="tgt">/ 210</span><span className="faint" style={{fontSize:'12px',marginLeft:'auto'}}>Nozzle</span></div>
            <div className="tmeter"><i style={{width:'100%'}}></i></div>
          </div>
          <div className="temp">
            <div className="top"><span className="ic"></span><span className="now">60°</span><span className="tgt">/ 60</span><span className="faint" style={{fontSize:'12px',marginLeft:'auto'}}>Bed</span></div>
            <div className="tmeter"><i style={{width:'100%'}}></i></div>
          </div>
        </div>
      </div>
      </div>

      <div className="col gap10">
        <button className="ctl row accent"><span style={{display:'inline-flex',alignItems:'center',gap:'9px'}}><ITune/>Tune mid-print</span><span className="chev">›</span></button>
        <div className="row gap10">
          <button className="ctl warn"><IPause/>Pause</button>
          <button className="ctl danger grow"><IStop/>Emergency stop</button>
        </div>
      </div>
    </div>
  );

/* ============================================================
   B — FOCUS RING
   ============================================================ */
function PS_B(){
  return (
    <div className="scr v-b">
      <Header/>

      <div className="body">
        <div className="hero-ring">
          <div className="ringwrap">
            <Ring pct={68} size={178} sw={11}/>
            <Preview id="ps-b-preview" shape="circle" style={{position:'absolute', top:'22px', left:'22px', width:'134px', height:'134px'}}/>
            <div className="badge">68%</div>

          <div className="timeblock">
            <div className="lbl" style={{marginBottom:'3px'}}>Time remaining</div>

        <div className="info">
          <div className="row between center" style={{padding:'0 2px'}}>
            <span className="fname">Benchy.gcode</span><Status/>

          <div className="statgrid">
            <div className="s"><span className="lbl">Layer</span><span className="v mono">142 / 209</span></div>

        <DCArtboard id="cf-ok-p" label="Positive · portrait" width={400} height={800} style={AB}><Confirm kind="ok"/></DCArtboard>
      </DCSection>
      <DCSection id="graph" title="Temperatures — graph" subtitle="A monitor screen: Focus carries the live current/setpoint value(s), Field holds the time-series graph. Single trace with a dashed setpoint, or multiple sensors overlaid on one axis with a legend. Gutter = Presets / Cooldown.">
        <DCArtboard id="tg-1p" label="Single · portrait" width={400} height={800} style={AB}><TempGraph/></DCArtboard>
        <DCArtboard id="tg-1l" label="Single · landscape" width={880} height={480} style={AB}><TempGraph land={true}/></DCArtboard>
        <DCArtboard id="tg-mp" label="Overlaid · portrait" width={400} height={800} style={AB}><TempGraph multi={true}/></DCArtboard>
        <DCArtboard id="tg-ml" label="Overlaid · landscape" width={880} height={480} style={AB}><TempGraph multi={true} land={true}/></DCArtboard>
      </DCSection>
      <DCSection id="screwtilt" title="Screws tilt — calibration tool" subtitle="A tool page: Focus = live bed diagram (each screw's required turn from Moonraker, highlighted screw pulses, instruction centered as an overlay) · Field = the four procedure actions. No Gutter.">
        <DCArtboard id="st-port" label="Screws tilt · portrait" width={400} height={800} style={AB}><ScrewTilt/></DCArtboard>
        <DCArtboard id="st-land" label="Screws tilt · landscape" width={880} height={480} style={AB}><ScrewTilt land={true}/></DCArtboard>
      </DCSection>
      <DCSection id="files" title="File / job picker — one screen" subtitle="Gutter = Cancel / Print. Portrait: no Focus while browsing (list fills); picking a file reveals the Focus (preview + centered info overlay). Landscape: Focus + Field stay visible — Focus is a placeholder until a file is picked (widening a list buys nothing; a preview does). A per-orientation flag drives whether the Focus renders.">
        <DCArtboard id="f-pb" label="Portrait · browsing" width={400} height={800} style={AB}><FilePicker/></DCArtboard>
        <DCArtboard id="f-ps" label="Portrait · selected" width={400} height={800} style={AB}><FilePicker selected={true}/></DCArtboard>
        <DCArtboard id="f-lb" label="Landscape · browsing" width={880} height={480} style={AB}><FilePicker land={true}/></DCArtboard>
        <DCArtboard id="f-ls" label="Landscape · selected" width={880} height={480} style={AB}><FilePicker land={true} selected={true}/></DCArtboard>
      </DCSection>
      <DCSection id="move" title="Move — jog & home" subtitle="Focus = the XY jog pad as a 3×3 (corner cells show live Y / Z / X, arrows on the edges, Home in the center). Field = Z up/home/down + the increment selector. Gutter = Home / Disable / Back.">
        <DCArtboard id="mv-port" label="Move · portrait" width={400} height={800} style={AB}><Move/></DCArtboard>
        <DCArtboard id="mv-land" label="Move · landscape" width={880} height={480} style={AB}><Move land={true}/></DCArtboard>
      </DCSection>
      <DCSection id="foundations" title="Design language" subtitle="The system every screen inherits — type, color roles, the outline-led control principle.">
        <DCArtboard id="spec" label="Foundations" width={460} height={800} style={{borderRadius:24, background:'var(--bg)'}}><Spec/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.body.appendChild(document.createElement('div'))).render(<App/>);
</script>

<script>
/* S/M/L text-size preference — sets the --fs scale every screen reads */
document.querySelectorAll('.fsbar button').forEach(function(b){
  b.addEventListener('click', function(){
    document.documentElement.style.setProperty('--fs', b.dataset.fs);
    document.querySelectorAll('.fsbar button').forEach(function(x){ x.classList.toggle('on', x===b); });
  });
});
</script>
</body>
</html>
